<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: #0a0b10;
        color: #ffffff;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #boot-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 0% 0%, #1a1c2c 0%, #0a0b10 100%);
      }
      #boot-screen .boot-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px;
      }
      #boot-screen .boot-ring {
        width: 52px;
        height: 52px;
        border-radius: 9999px;
        border: 4px solid rgba(242, 169, 0, 0.28);
        border-top-color: #f2a900;
        animation: spin 1s linear infinite;
      }
      #boot-screen .boot-title {
        font-size: 14px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.7);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-screen">
      <div class="boot-card">
        <div class="boot-ring"></div>
        <div class="boot-title">Sool-Log</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
